<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141312">
<title>VDECK</title>
<style>
:root{
  --ink:#141312;
  --ink2:#1e1c1a;
  --ink3:#2a2724;
  --line:#3a3633;
  --fg:#efe9e0;
  --dim:#948c82;
  --amber:#e8a33d;
  --amber-d:#8a5f1d;
  --cut:#d9584a;
  --claude-orange:#da7756;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sys:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  --top:env(safe-area-inset-top);
  --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--fg);font-family:var(--sys);
  font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
}
#sideAnalyzer{display:none}
#mainCol{display:flex;flex-direction:column;flex:1;min-height:0;width:100%}
.analyzerWrap{display:none}
.analyzerWrap.on{display:block}
.videoStage{display:none}
.videoStage.on{display:block}

/* ---- 横画面：左に偽アナライザーを固定、右にいつも通りの画面を並べる ---- */
@media (orientation:landscape){
  body{flex-direction:row}
  #sideAnalyzer{
    display:flex;flex-direction:column;justify-content:center;
    width:42%;max-width:440px;flex:none;padding:16px;
    background:var(--ink2);border-right:1px solid var(--line);
  }
  #mainCol{flex:1;min-width:0}
  #pane-now .anToggle,#pane-now .analyzerWrap,#pane-now .videoStage{display:none!important}
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}

header{
  display:none;
}
header h1{
  margin:0;font-family:var(--mono);font-size:15px;letter-spacing:.22em;
  font-weight:600;color:var(--amber);cursor:pointer;
  padding:2px 4px;margin:-2px -4px;border-radius:6px;
}
header h1:active{background:var(--ink3)}
header .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em}
header .quota{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.pane{display:none;padding:14px 14px 24px}
.pane.on{display:block}

.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);
  text-transform:uppercase;margin:2px 0 10px;display:flex;align-items:center;gap:8px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

.btn{
  min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;
  background:var(--ink2);display:inline-flex;align-items:center;justify-content:center;
  gap:8px;font-size:14px;font-weight:600;
}
.btn:active{background:var(--ink3)}
.btn.pri{background:var(--amber);color:#231a08;border-color:var(--amber)}
.btn.pri:active{background:#c9871f}
.btn.cut{border-color:var(--cut);color:var(--cut)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}

.card{
  display:flex;gap:12px;align-items:center;padding:10px;
  background:var(--ink2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
}
.card:active{background:var(--ink3)}
.thumb{
  width:82px;height:48px;flex:none;border-radius:7px;background:var(--ink3);
  object-fit:cover;display:block;
}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--dim)}
.meta{flex:1;min-width:0}
.ttl{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub2{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
.card .more{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:20px}

.empty{
  border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--dim);
}
.empty b{display:block;color:var(--fg);font-size:14px;margin-bottom:6px}

.anToggle{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);
  margin:18px 0 8px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;
}
.anToggle .sw{color:var(--amber)}
.analyzerWrap{
  padding:14px;border-radius:14px;
  background:var(--ink2);border:1px solid var(--line);
  overflow:hidden;cursor:pointer;
}
/* #analyzer/#analyzer2は「reminder」モード時のみ表示するcanvas（テキスト描画専用）。
   以前はドット演出もこのcanvasに毎フレームJSで描いていたが、2026-08-19に
   ドット演出は.sparkGrid（CSSアニメのみ）へ分離し、canvasはreminderモードの
   時だけ.onクラスで表示する方式に変更した（詳細は下部JSコメント参照） */
#analyzer,#analyzer2{display:none;width:100%;aspect-ratio:23/25;cursor:pointer;margin:0 auto}
#analyzer.on,#analyzer2.on{display:block}

/* ===== ドット演出（sparkGrid、2026-08-19にcanvas毎フレーム描画から置き換え） =====
   旧実装は毎フレームJSでgetComputedStyle/getBoundingClientRectを2回ずつ呼んで
   575マス(23×25)を再計算・再描画しており、これがVDECK再生中の発熱の主因だった。
   新実装はマスをdivとして一度だけ生成し、あとはCSS keyframesの明滅アニメに
   完全に任せる（JSのrequestAnimationFrameループ自体を廃止）。 */
.sparkGrid{
  display:none; grid-template-columns:repeat(23,1fr); gap:3px;
  width:100%; aspect-ratio:23/25; margin:0 auto;
}
.sparkGrid.on{display:grid}
.sparkGrid .cell{
  border-radius:1px; background:var(--ink3);
  animation:vdSparkFlicker 3s ease-in-out infinite;
}
@keyframes vdSparkFlicker{
  0%,100%{ background:var(--ink3); }
  50%{ background:var(--claude-orange); }
}
/* 横向きは#sideAnalyzerの42%枠内に収まるよう、おじさん要望で3割ほど小さく表示する（2026-08-19） */
@media (orientation:landscape){
  .sparkGrid{ width:70%; }
}
.videoStage{
  width:100%;border-radius:14px;overflow:hidden;background:#000;
}
.videoStage video{width:100%;display:block;cursor:pointer}

#transport{
  border-top:1px solid var(--line);background:var(--ink2);
  padding:8px 12px calc(var(--bot) + 8px);
}
#tBar{height:14px;padding:5px 20px;margin-bottom:4px;box-sizing:content-box;
  background:none;cursor:pointer}
#tBarIn{height:4px;background:var(--ink3);border-radius:2px;overflow:hidden}
#tFill{height:100%;background:var(--amber);width:0}
.tRow{display:flex;align-items:center;gap:6px}
.tRow .np{flex:1;min-width:0}
.tRow .np .ttl{font-size:13px}
.ctl{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;color:var(--dim)}
.ctl svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.ctl:active{background:var(--ink3)}
.ctl.on{color:var(--amber)}
.ctl.big{background:var(--amber);color:#231a08}
.ctl.big svg{width:23px;height:23px}
.ctl#bPrev,.ctl#bNext{color:var(--fg)}

nav{
  display:flex;border-top:1px solid var(--line);background:var(--ink2);
  padding-bottom:var(--bot);
}
nav button{
  flex:1;padding:9px 0 7px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;
  border-top:2px solid transparent;margin-top:-1px;min-height:52px;
}
nav button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--amber);border-top-color:var(--amber)}

#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40}
#veil.on{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--ink2);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:14px 14px calc(var(--bot) + 14px);transform:translateY(110%);
  transition:transform .22s ease;max-height:88vh;overflow-y:auto;
}
#sheet.on{transform:translateY(0)}
#sheet h3{margin:2px 0 12px;font-size:15px}
#sheet .opt{
  display:block;width:100%;text-align:left;padding:13px 12px;border-radius:10px;
  background:var(--ink3);margin-bottom:7px;font-size:14px;
}
#sheet .opt.danger{color:var(--cut)}
#sheet .opt{white-space:pre-line;line-height:1.45}
input[type=text]{
  width:100%;min-height:44px;padding:0 12px;border-radius:10px;
  background:var(--ink3);border:1px solid var(--line);
}
#toast{
  position:fixed;left:50%;bottom:calc(var(--bot) + 92px);transform:translate(-50%,14px);
  background:var(--fg);color:var(--ink);padding:9px 16px;border-radius:20px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hint{font-size:12px;color:var(--dim);line-height:1.6}
.volRow{display:flex;align-items:center;gap:10px;margin:16px 2px 4px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.volRow input[type=range]{
  flex:1;height:4px;-webkit-appearance:none;appearance:none;
  background:var(--ink3);border-radius:2px;outline:none;
}
.volRow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--amber);cursor:pointer;border:0;
}
.volRow input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:var(--amber);cursor:pointer;border:0;
}
.volRow .volVal{width:38px;text-align:right;color:var(--fg);flex:none}
.volRow .volLabel{flex:none}
</style>
</head>
<body>

<input type="file" id="pickBgVideo" accept="video/*" hidden>

<div id="sideAnalyzer">
  <div class="anToggle" id="anCapSide">analyzer<span class="sw" id="anSwitch2">⇄ 動画</span></div>
  <div class="analyzerWrap on" id="dotsBoxSide"><div class="sparkGrid" id="sparkGridSide"></div><canvas id="analyzer2"></canvas></div>
  <div class="videoStage" id="videoBoxSide"><video id="bgVid2" muted loop playsinline></video></div>
</div>
<div id="mainCol">

<header>
  <h1 id="brand">VDECK</h1>
  <span class="sub">v1</span>
  <span class="quota" id="quota"></span>
</header>

<main>
  <section class="pane on" id="pane-lib">
    <div class="eyebrow">ライブラリ</div>
    <div class="row" style="margin-bottom:14px">
      <label class="btn pri" style="flex:1">
        曲を取り込む
        <input type="file" id="pick" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac" multiple hidden>
      </label>
      <button class="btn" id="fixAll">調べ直す</button>
      <button class="btn" id="normAll">音量そろえ</button>
    </div>
    <div id="libList"></div>
  </section>

  <section class="pane" id="pane-pl">
    <div class="eyebrow">再生リスト</div>
    <button class="btn wide" id="newPl" style="margin-bottom:14px">＋ 新しいリストを作る</button>
    <div id="plList"></div>
  </section>

  <section class="pane" id="pane-now">
    <audio id="vid" preload="metadata"></audio>
    <div>
      <div class="anToggle" id="anCapNow">analyzer<span class="sw" id="anSwitch">⇄ 動画</span></div>
      <div class="analyzerWrap on" id="dotsBoxNow">
        <div class="sparkGrid" id="sparkGridNow"></div>
        <canvas id="analyzer"></canvas>
      </div>
      <div class="videoStage" id="videoBoxNow">
        <video id="bgVid" muted loop playsinline></video>
      </div>

      <div class="volRow">
        <span class="volLabel">音量</span>
        <span class="volVal" id="volVal">未調整</span>
      </div>
    </div>
  </section>
</main>

<div id="transport">
  <div id="tBar"><div id="tBarIn"><div id="tFill"></div></div></div>
  <div class="tRow">
    <div class="np"><div class="ttl" id="miniTitle">—</div>
      <div class="sub2" id="miniTime">0:00 / 0:00</div></div>
    <button class="ctl" id="bShuffle" aria-label="ランダム"><svg viewBox="0 0 24 24"><path d="M17 4l4 3-4 3"/><path d="M17 14l4 3-4 3"/><path d="M3 7h4l3 4"/><path d="M3 17h4l10-13h4"/><path d="M14 17h7"/></svg></button>
    <button class="ctl" id="bPrev" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M6 5v14" stroke-linecap="round"/><path d="M19 5.5v13a.7.7 0 0 1-1.1.6L8.5 12.6a.7.7 0 0 1 0-1.2l9.4-6.5a.7.7 0 0 1 1.1.6z" fill="currentColor" stroke="none"/></svg></button>
    <button class="ctl big" id="bPlay" aria-label="再生"><svg viewBox="0 0 24 24" id="icPlay"><path d="M7 4.5v15a.6.6 0 0 0 .93.5l11.5-7.5a.6.6 0 0 0 0-1L7.93 4a.6.6 0 0 0-.93.5z" fill="currentColor" stroke="none"/></svg></button>
    <button class="ctl" id="bNext" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M18 5v14" stroke-linecap="round"/><path d="M5 5.5v13a.7.7 0 0 0 1.1.6l9.4-6.5a.7.7 0 0 0 0-1.2L6.1 4.9A.7.7 0 0 0 5 5.5z" fill="currentColor" stroke="none"/></svg></button>
    <button class="ctl" id="bRepeat" aria-label="繰り返し"><svg viewBox="0 0 24 24" id="icRepeat"><path d="M17 2l4 4-4 4"/><path d="M3 12V10a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v2a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
</div>

<nav>
  <button class="on" data-p="lib"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></svg>LIBRARY</button>
  <button data-p="pl"><svg viewBox="0 0 24 24"><path d="M3 6h12M3 11h12M3 16h7"/><circle cx="17" cy="17" r="3"/><path d="M20 17V8l3 1"/></svg>LISTS</button>
  <button data-p="now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.8v6.4l5-3.2z" fill="currentColor" stroke="none"/></svg>NOW</button>
</nav>

</div>

<div id="veil"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
"use strict";
const DBN="vdeck",DBV=4;let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,DBV);
 r.onupgradeneeded=e=>{const d=e.target.result;
  ["videos","clips","playlists","chunks","bgvideo","rimaface"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})});};
 r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error);});}
function tx(s,m){return db.transaction(s,m).objectStore(s);}
function put(s,v){return new Promise((res,rej)=>{const r=tx(s,"readwrite").put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error);});}
function del(s,id){return new Promise((res,rej)=>{const r=tx(s,"readwrite").delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error);});}
function all(s){return new Promise((res,rej)=>{const r=tx(s,"readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function one(s,id){return new Promise((res,rej)=>{const r=tx(s,"readonly").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let VIDEOS=[],PLAYLISTS=[];
let queue=[],qi=-1,shuffle=false,repeat="off",curURL=null,curVid=null;

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const vid=$("#vid");

function fmt(t){if(!isFinite(t)||t<0)t=0;const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0");}
function fmt1(t){if(!isFinite(t)||t<0)t=0;const m=Math.floor(t/60),s=(t%60).toFixed(1).padStart(4,"0");return m+":"+s;}
function mb(b){return b>=1073741824?(b/1073741824).toFixed(1)+"GB":Math.round(b/1048576)+"MB";}
let tT;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("on"),1800);}

function sheet(title,opts){
  const s=$("#sheet");s.innerHTML="<h3>"+title+"</h3>";
  opts.forEach(o=>{
    if(o.isLabelFor){
      const l=document.createElement("label");l.className="opt";
      l.setAttribute("for",o.isLabelFor);l.textContent=o.label;
      l.onclick=()=>setTimeout(closeSheet,50);
      s.appendChild(l);return;
    }
    const b=document.createElement("button");b.className="opt"+(o.danger?" danger":"");
    b.textContent=o.label;b.onclick=()=>{closeSheet();setTimeout(o.fn,180)};s.appendChild(b);
  });
  const c=document.createElement("button");c.className="opt";c.textContent="キャンセル";c.onclick=closeSheet;s.appendChild(c);
  $("#veil").classList.add("on");requestAnimationFrame(()=>s.classList.add("on"));
}
function sheetInput(title,ph,val,fn){
  const s=$("#sheet");s.innerHTML="<h3>"+title+"</h3>";
  const i=document.createElement("input");i.type="text";i.placeholder=ph;i.value=val||"";s.appendChild(i);
  const r=document.createElement("div");r.className="row";r.style.marginTop="10px";
  const ok=document.createElement("button");ok.className="btn pri";ok.style.flex="1";ok.textContent="決定";
  ok.onclick=()=>{const v=i.value.trim();if(!v)return;closeSheet();setTimeout(()=>fn(v),180)};
  const ng=document.createElement("button");ng.className="btn";ng.textContent="やめる";ng.onclick=closeSheet;
  r.append(ok,ng);s.appendChild(r);
  $("#veil").classList.add("on");requestAnimationFrame(()=>s.classList.add("on"));
  setTimeout(()=>i.focus(),260);
}
function closeSheet(){$("#sheet").classList.remove("on");$("#veil").classList.remove("on");}
$("#veil").onclick=closeSheet;

async function relink(){
  const byId=new Set(VIDEOS.map(v=>v.id));
  let fixP=0,lostP=0;
  for(const p of PLAYLISTS){
    let changed=false;
    p.items=p.items.filter(it=>{
      const alive=byId.has(it.refId);
      if(!alive){lostP++;changed=true;return false;}
      return true;
    });
    if(changed){await put("playlists",p);fixP++;}
  }
  await reload();
  sheet("修復しました",[
    "手直しした再生リスト\n"+fixP+" 件",
    "リストから外した項目\n"+lostP+" 件",
  ].map(t=>({label:t,fn:()=>{}})));
}
function carDiag(){
  const ms=("mediaSession" in navigator);
  let handlers="不明";
  if(ms){
    try{navigator.mediaSession.setActionHandler("nexttrack",()=>next());handlers="受け付けています"}
    catch(_){handlers="受け付けられません"}
  }
  const meta=ms&&navigator.mediaSession.metadata;
  sheet("車での再生 診断",[
    "曲情報の窓口\n"+(ms?"使えます":"使えません（このブラウザは未対応）"),
    "ステアリング操作の受け口\n"+handlers,
    "ナビに送っている曲名\n"+(meta?meta.title:"未設定"),
    "ナビに送っている元曲名\n"+(meta&&meta.artist?meta.artist:"未設定"),
    "ジャケット画像\n"+(meta&&meta.artwork&&meta.artwork.length?"送っています":"なし（サムネ未設定）"),
    "再生状態\n"+((ms&&navigator.mediaSession.playbackState)||"未設定"),
    "音量\n"+Math.round(vid.volume*100)+"%"+(vid.muted?"（消音中）":""),
  ].map(t=>({label:t,fn:()=>{}})));
}

$("#brand").onclick=()=>{
  sheet("VDECK v1",[
    {label:"再読み込み",fn:()=>location.reload()},
    {label:"迷子のリストを修復する",fn:()=>relink()},
    {label:"車での再生を診断する",fn:()=>carDiag()},
    {label:"背景動画を選ぶ／変える",isLabelFor:"pickBgVideo"},
    {label:"強制更新（キャッシュを捨てて最新を取得）",fn:async()=>{
      try{
        if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
        if(navigator.serviceWorker){
          const rs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(rs.map(r=>r.unregister()));
        }
      }catch(_){}
      const u=location.origin+location.pathname+"?v="+Date.now();
      location.replace(u);
    }},
    {label:"保存状況を見る",fn:async()=>{
      let usage=0,quota=0;
      try{const e=await navigator.storage.estimate();usage=e.usage||0;quota=e.quota||0}catch(_){}

const CHUNK=8*1048576;
let lastErr="";
async function store(f){
  const id=uid(),type=f.type||"audio/mpeg";
  const n=Math.max(1,Math.ceil(f.size/CHUNK));
  lastErr="";
  try{
    for(let i=0;i<n;i++){
      const buf=await f.slice(i*CHUNK,Math.min(f.size,(i+1)*CHUNK)).arrayBuffer();
      await put("chunks",{id:id+":"+i,data:buf});
      if(n>4&&i%3===0)toast(f.name.slice(0,16)+" 保存中 "+Math.round((i+1)/n*100)+"%");
    }
    await put("videos",{id,name:f.name.replace(/\.[^.]+$/,""),
      type,size:f.size,chunks:n,dur:0,thumb:null,addedAt:Date.now()});
    return id;
  }catch(err){
    for(let i=0;i<n;i++){try{await del("chunks",id+":"+i)}catch(_){}}
    const nm=(err&&err.name)||String(err);
    lastErr=nm==="QuotaExceededError"?"保存領域がいっぱいです":"保存に失敗 "+nm;
    toast(lastErr);
    return null;
  }
}
let blobCache={id:null,blob:null};
const BLOB_BATCH=16;
async function blobOf(rec){
  if(!rec)return null;
  if(blobCache.id===rec.id&&blobCache.blob)return blobCache.blob;
  let b=null;
  if(rec.chunks){
    let acc=null,batch=[];
    for(let i=0;i<rec.chunks;i++){
      const c=await one("chunks",rec.id+":"+i);
      if(!c)return null;
      batch.push(c.data);
      if(batch.length>=BLOB_BATCH||i===rec.chunks-1){
        acc=acc?new Blob([acc,...batch],{type:rec.type||"audio/mpeg"})
             :new Blob(batch,{type:rec.type||"audio/mpeg"});
        batch=[];
      }
    }
    b=acc;
  }
  else if(rec.data)b=new Blob([rec.data],{type:rec.type||"audio/mpeg"});
  else b=rec.blob||null;
  blobCache={id:rec.id,blob:b};
  return b;
}
async function dropVideo(v){
  if(blobCache.id===v.id)blobCache={id:null,blob:null};
  await del("videos",v.id);
  if(v.chunks)for(let i=0;i<v.chunks;i++){try{await del("chunks",v.id+":"+i)}catch(_){}}
}

function seekTo(v,t){return new Promise(r=>{
  let f=false;const h=()=>{if(f)return;f=true;v.removeEventListener("seeked",h);clearTimeout(to);r()};
  const to=setTimeout(h,5000);
  v.addEventListener("seeked",h);
  try{v.currentTime=t}catch(_){h()}
});}

function trueDuration(v){return new Promise(r=>{
  let f=false;
  const fin=()=>{if(f)return;f=true;
    v.removeEventListener("seeked",sk);v.removeEventListener("durationchange",dc);clearTimeout(to);
    const d=isFinite(v.duration)&&v.duration>0?v.duration:0;
    r(d);};
  const sk=()=>fin(),dc=()=>{};
  const to=setTimeout(fin,25000);
  v.addEventListener("seeked",sk);v.addEventListener("durationchange",dc);
  try{v.currentTime=1e101}catch(_){fin()}
});}

function probe(src){
  return new Promise(res=>{
    const u=URL.createObjectURL(src),v=document.createElement("audio");
    v.muted=true;v.defaultMuted=true;v.preload="auto";
    v.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.appendChild(v);
    let f=false;
    const fin=r=>{if(f)return;f=true;clearTimeout(to);
      try{v.pause()}catch(_){}
      URL.revokeObjectURL(u);v.removeAttribute("src");
      try{v.load()}catch(_){}
      v.remove();res(r);};
    const to=setTimeout(()=>fin({dur:0,err:"timeout"}),45000);
    v.onerror=()=>fin({dur:0,err:(v.error&&v.error.code===4)?"codec":"read"});
    v.onloadedmetadata=async()=>{
      try{
        try{await v.play()}catch(_){}
        let dur=await trueDuration(v);
        try{v.pause()}catch(_){}
        fin({dur});
      }catch(_){fin({dur:0,err:"read"})}
    };
    v.src=u;
  });
}

async function diagnose(rec){
  toast("調べてます…");

  if(rec.chunks){
    for(let i=0;i<rec.chunks;i++){
      const c=await one("chunks",rec.id+":"+i);
      if(c&&c.data){found++;bytes+=c.data.byteLength;}
    }
  }else if(rec.data){found=1;bytes=rec.data.byteLength;}
  const b=await blobOf(rec);
  const hdr=b?await mp4Duration(b):0;
  const okAll=bytes===rec.size;
  sheet("診断： "+rec.name,[
    "元ファイルのサイズ\n"+rec.size.toLocaleString()+" B（"+mb(rec.size)+"）",
    "実際に入ってるデータ\n"+bytes.toLocaleString()+" B（"+mb(bytes)+"）",
    "かけらの数\n"+found+" / "+(rec.chunks||1),
    "組み直した結果\n"+(b?b.size.toLocaleString()+" B":"組み直し失敗"),
    "設計図に書いてある長さ\n"+(hdr?fmt(hdr):"読み取れず"),
    "いま表示してる長さ\n"+fmt(rec.dur||0),
    okAll?"データは欠けてません":"データが不足しています： "+mb(rec.size-bytes)+" 足りません"
  ].map(t=>({label:t,fn:()=>{}})));
}
async function repair(rec,quiet){
  const b=await blobOf(rec);
  if(!b||!b.size){if(!quiet)toast("データがありません");return;}
  if(!quiet)toast("調べ直してます… "+rec.name);

/* ===== 音量そろえ =====
   曲によって音量差があるのを直す機能。
   ⚠️2026-08-19判明：iOS Safari/WKWebView（＝iPhoneのホーム画面PWA）は
   <audio>要素の.volumeプロパティをJSから変更しても実機の音量には反映されない
   仕様のため、旧実装（測定した倍率をvid.volumeに毎回掛けるだけの方式）は
   iPhoneでは実質何も起きていなかった。以前検討したAudioContext＋GainNode
   常時接続版は、このセッションで散々苦労して撤去した「バックグラウンド
   再生が止まる」「タップで音がおかしくなる」不具合を再発させかねないため
   不採用。代わりに「測定した倍率を、音声データ自体（波形）に焼き込んで
   保存し直す」方式に変更した。実際のサンプル値を減衰させてWAVとして
   保存し直すので、.volumeに頼らずiOSでも確実に効く。
   引き換えに「再生しながらその場で微調整するスライダー」は廃止した
   （調整のたびに数分の曲を丸ごと焼き直すのは重すぎるため）。自動測定の
   「音量そろえ」に一本化し、既に十分静か（倍率0.97超）な曲は書き換え
   自体をスキップして容量増加を最小限に抑える（WAVは元のmp3等より
   容量が数倍〜10倍程度に増えるため、変更不要な曲まで焼き直さない）。
   測定・焼き込みは一時的なAudioContextで行うが、再生経路(vid)には
   一切繋がない（このcontextは使い捨てで、mainのvidには触れない）。 */
const TARGET_RMS=0.1;
let measureCtx=null;
function ensureMeasureCtx(){
  if(!measureCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)measureCtx=new AC();
  }
  return measureCtx;
}
function volFromRms(rms){
  if(!rms||rms<=0)return 1;
  return Math.max(0.15,Math.min(1,TARGET_RMS/rms));
}
// AudioBufferを16bit PCM WAVへエンコードしつつ、gain(0〜1)を波形に焼き込む。
// gain<=1前提（このアプリの音量そろえは下げる方向にしか使わないため、
// クリッピング防止のclampはあるが実質発火しない）。
function bufferToWavWithGain(buffer,gain){
  const numCh=buffer.numberOfChannels;
  const sampleRate=buffer.sampleRate;
  const numFrames=buffer.length;
  const blockAlign=numCh*2;
  const dataSize=numFrames*blockAlign;
  const ab=new ArrayBuffer(44+dataSize);
  const view=new DataView(ab);
  const ws=(off,s)=>{for(let i=0;i<s.length;i++)view.setUint8(off+i,s.charCodeAt(i));};
  ws(0,'RIFF');view.setUint32(4,36+dataSize,true);ws(8,'WAVE');
  ws(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);
  view.setUint16(22,numCh,true);view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*blockAlign,true);view.setUint16(32,blockAlign,true);
  view.setUint16(34,16,true);
  ws(36,'data');view.setUint32(40,dataSize,true);
  const chans=[];for(let c=0;c<numCh;c++)chans.push(buffer.getChannelData(c));
  let off=44;
  for(let i=0;i<numFrames;i++){
    for(let c=0;c<numCh;c++){
      let s=chans[c][i]*gain;
      s=Math.max(-1,Math.min(1,s));
      view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);
      off+=2;
    }
  }
  return new Blob([ab],{type:'audio/wav'});
}
// 測定して、必要なら音量そろえ後の音声データで保存し直すところまで一括で行う。
// 戻り値: {ok, changed, vol}。changed=trueの時だけIndexedDBの中身を書き換えている。
async function measureAndMaybeFix(v){
  const b=await blobOf(v);
  if(!b||!b.size||b.size>300*1048576)return{ok:false};
  const ctx=ensureMeasureCtx();
  if(!ctx)return{ok:false};
  let buf;
  try{buf=await ctx.decodeAudioData(await b.arrayBuffer());}
  catch(_){return{ok:false};}
  const ch=buf.getChannelData(0);
  const step=Math.max(1,Math.floor(ch.length/200000));
  let sum=0,n=0;
  for(let i=0;i<ch.length;i+=step){sum+=ch[i]*ch[i];n++;}
  const rms=Math.sqrt(sum/Math.max(1,n));
  const vol=volFromRms(rms);
  if(vol>0.97)return{ok:true,changed:false,vol};
  const wavBlob=bufferToWavWithGain(buf,vol);
  const oldChunks=v.chunks||0;
  for(let i=0;i<oldChunks;i++){try{await del("chunks",v.id+":"+i);}catch(_){}}
  const n2=Math.max(1,Math.ceil(wavBlob.size/CHUNK));
  for(let i=0;i<n2;i++){
    const chunkBuf=await wavBlob.slice(i*CHUNK,Math.min(wavBlob.size,(i+1)*CHUNK)).arrayBuffer();
    await put("chunks",{id:v.id+":"+i,data:chunkBuf});
  }
  v.type='audio/wav';v.size=wavBlob.size;v.chunks=n2;v.vol=1;v.volApplied=true;v.volFactor=vol;
  delete v.data;
  await put("videos",v);
  if(blobCache.id===v.id)blobCache={id:null,blob:null};
  return{ok:true,changed:true,vol};
}
async function normalizeOne(v){
  toast("音量を測定中… "+v.name);
  const r=await measureAndMaybeFix(v);
  if(!r.ok){toast("測定できませんでした");return;}
  if(!r.changed){toast(v.name+" はそのままで大丈夫そうです");return;}
  await reload();
  toast(v.name+" の音量を ×"+r.vol.toFixed(2)+" に調整しました");
}

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    mediaSetup();mediaState();mediaPos();
    const it=queue[qi];if(it)mediaInfo(it);
  }
});

function mediaSetup(){
  if(!("mediaSession" in navigator))return;
  const ms=navigator.mediaSession;
  const set=(k,fn)=>{try{ms.setActionHandler(k,fn)}catch(_){}};
  set("play",()=>vid.play().catch(()=>{}));
  set("pause",()=>vid.pause());
  set("stop",()=>vid.pause());
  set("nexttrack",()=>next());
  set("previoustrack",()=>prev());
  set("seekforward",e=>{const it=queue[qi];if(!it)return;
    const en=it.end||vid.duration||0;
    vid.currentTime=Math.min(en-0.1,vid.currentTime+((e&&e.seekOffset)||15));});
  set("seekbackward",e=>{const it=queue[qi];if(!it)return;
    vid.currentTime=Math.max(it.start||0,vid.currentTime-((e&&e.seekOffset)||15));});
  set("seekto",e=>{const it=queue[qi];if(!it||!e||e.seekTime==null)return;
    vid.currentTime=(it.start||0)+e.seekTime;});
}

function mediaInfo(it){
  if(!("mediaSession" in navigator)||!it)return;
  const v=VIDEOS.find(v=>v.id===it.videoId);
  const art=it.thumb||(v&&v.thumb);
  const meta={title:it.title||"VDECK",artist:v?v.name:"VDECK",album:"VDECK"};
  if(art)meta.artwork=[{src:art,sizes:"320x180",type:"image/jpeg"}];
  try{navigator.mediaSession.metadata=new MediaMetadata(meta)}catch(_){}
}
function mediaState(){
  if(!("mediaSession" in navigator))return;
  try{navigator.mediaSession.playbackState=vid.paused?"paused":"playing"}catch(_){}
}
function mediaPos(){
  if(!("mediaSession" in navigator)||!navigator.mediaSession.setPositionState)return;
  const it=queue[qi];if(!it)return;
  const s=it.start||0,en=it.end||vid.duration||0;
  const dur=Math.max(0,en-s);
  if(!isFinite(dur)||dur<=0)return;
  try{navigator.mediaSession.setPositionState({
    duration:dur,playbackRate:vid.playbackRate||1,
    position:Math.max(0,Math.min(dur,vid.currentTime-s))});}catch(_){}
}
function playQueue(q,i){queue=q;qi=i;preload={qi:null,videoId:null,url:null};shuffleBag=[];go("now");load(true);}
function playLibraryFrom(videoId){
  const q=VIDEOS.slice().sort((a,b)=>b.addedAt-a.addedAt)
    .map(v=>({kind:"video",videoId:v.id,title:v.name,start:0,end:null}));
  const i=q.findIndex(it=>it.videoId===videoId);
  playQueue(q,i>=0?i:0);
}
let skipGuard=0;
/* スマホがスリープ中（画面ロック中）だと、曲が終わってから次の曲データを
   IndexedDBから読みに行く「その場読み込み」だと間に合わないことがある。
   音が止まった瞬間にブラウザがこのページのJS実行を後回しにし始めるらしく、
   読み込みが終わる前にタイムアウトしたように固まってしまう。
   対策として、今の曲を再生し始めたタイミングで次の曲のデータを
   あらかじめ用意しておき、曲が終わった瞬間はURLを差し替えるだけで
   済むようにする（音が鳴ってる間に重い読み込みを終わらせておく） */
let preload={qi:null,videoId:null,url:null};
/* ===== ランダム再生の偏り対策 =====
   以前はMath.random()で毎回完全ランダムに選んでいた（直前の曲だけ除外）。
   これだと数学的には均等でも、体感では同じ曲が短時間に何度も当たったり
   逆に全然出てこない曲が出たりする（「トランプの山を毎回シャッフルし直す」
   方式の宿命）。なので「山（bag）を1回作って端から引いていき、山が空に
   なったらまた作り直す」方式に変更。これで全曲を1周してから次の1周に
   入るようになり、体感の偏りが減る */
let shuffleBag=[];
function refillShuffleBag(avoidIdx){
  const arr=queue.map((_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  if(arr.length>1&&arr[0]===avoidIdx){
    const swapAt=1+Math.floor(Math.random()*(arr.length-1));
    [arr[0],arr[swapAt]]=[arr[swapAt],arr[0]];
  }
  shuffleBag=arr;
}
function pickNextQi(){
  if(repeat==="one")return qi;
  if(!queue.length)return null;
  if(shuffle){
    if(queue.length<=1)return 0;
    if(!shuffleBag.length)refillShuffleBag(qi);
    return shuffleBag.shift();
  }
  if(qi<queue.length-1)return qi+1;
  if(repeat==="all")return 0;
  return null;
}
async function preloadNextTrack(){
  const nqi=preload.qi!=null?preload.qi:pickNextQi();
  if(nqi==null||nqi===qi)return;
  const it=queue[nqi];if(!it)return;
  if(preload.qi===nqi&&preload.videoId===it.videoId&&preload.url)return; // 用意済み
  try{
    const v=await one("videos",it.videoId);
    if(!v)return;
    const b=await blobOf(v);
    if(!b||!b.size)return;
    if(preload.url)URL.revokeObjectURL(preload.url);
    preload={qi:nqi,videoId:it.videoId,url:URL.createObjectURL(b)};
  }catch(_){}
}
async function load(auto){
  const it=queue[qi];if(!it)return;
  if(curVid!==it.videoId){
    let url,v;
    if(preload.qi===qi&&preload.videoId===it.videoId&&preload.url){
      // 事前に用意しておいたものを使う。IndexedDBの読み込みを待たずに
      // ほぼ即座に切り替えられる
      url=preload.url;
      v=await one("videos",it.videoId);
      preload={qi:null,videoId:null,url:null};
      if(!v){
        if(++skipGuard>=queue.length){skipGuard=0;
          return toast("このリストの曲が見つかりません");}
        return next();
      }
    }else{
      v=await one("videos",it.videoId);
      if(!v){
        if(++skipGuard>=queue.length){skipGuard=0;
          return toast("このリストの曲が見つかりません");}
        return next();
      }
      const b=await blobOf(v);
      if(!b||!b.size){
        if(++skipGuard>=queue.length){skipGuard=0;
          return toast("曲データが壊れています。取り込み直してください");}
        return next();
      }
      url=URL.createObjectURL(b);
    }
    skipGuard=0;
    if(curURL)URL.revokeObjectURL(curURL);
    curURL=url;curVid=it.videoId;vid.src=curURL;vid.load();
    vid.volume=(v.vol!=null?v.vol:1);
    syncVolUI(v.volFactor);
  }
  $("#miniTitle").textContent=it.title;
  mediaInfo(it);
  const seek=()=>{
    vid.onloadedmetadata=null;
    try{vid.currentTime=it.start||0}catch(_){}
    if(auto)vid.play().catch(()=>toast("再生ボタンを押してください"));
  };
  if(vid.readyState>=1)seek();else vid.onloadedmetadata=seek;
  preloadNextTrack(); // 次の次に備えて、今の曲の「次」を先読みしておく
}
function next(){
  if(repeat==="one")return load(true);
  if(!queue.length)return;
  const nqi=preload.qi!=null?preload.qi:pickNextQi();
  if(nqi==null){vid.pause();return;}
  qi=nqi;
  load(true);
}
function prev(){
  const it=queue[qi];
  if(it&&vid.currentTime-(it.start||0)>3)return vid.currentTime=it.start||0;
  if(qi>0){qi--;load(true);}else if(it){vid.currentTime=it.start||0;}
}
$("#bPlay").onclick=()=>{if(!queue.length)return toast("曲を選んでください");vid.paused?vid.play().catch(()=>{}):vid.pause();};
$("#bNext").onclick=next;$("#bPrev").onclick=prev;
$("#bShuffle").onclick=()=>{shuffle=!shuffle;preload={qi:null,videoId:null,url:null};shuffleBag=[];syncBtns();toast(shuffle?"ランダム ON":"ランダム OFF")};

/* ===== 再生中の音量表示 =====
   以前はここに「再生しながらその場で微調整するスライダー」があったが、
   iOSでは.volumeが効かないと判明したため廃止（詳細は上の「音量そろえ」
   セクションのコメント参照）。今は「音量そろえ」で焼き込み済みの倍率を
   読み取り専用で表示するだけの場所になっている。 */
const volVal=$("#volVal");

}

// === 画面ロック防止（Wake Lock） ===
// 再生中に画面が自動ロックされてバックグラウンドへ回ると、iOS側がページを
// 作り直す（＝再読み込み）ことがあり、その際main.jsの起動処理でHOME画面に
// 戻されてしまう。再生中だけ画面ロックを止めて発生条件を減らす。
let wakeLock=null;
async function requestWakeLock(){
  if(!("wakeLock" in navigator))return;
  try{
    wakeLock=await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release",()=>{wakeLock=null;});
  }catch(_){wakeLock=null;}
}
async function releaseWakeLock(){
  if(wakeLock){try{await wakeLock.release();}catch(_){}wakeLock=null;}
}
document.addEventListener("visibilitychange",()=>{
  // Wake Lockはタブが隠れると自動で解除される仕様のため、
  // 再生中に画面へ戻ってきたタイミングで再取得する。
  if(!document.hidden&&!vid.paused)requestWakeLock();
});

vid.onplay=vid.onpause=()=>{
  syncBtns();mediaState();mediaPos();
  if(anMode==="video"){
    if(vid.paused){$("#bgVid").pause();$("#bgVid2").pause();}
    else{$("#bgVid").play().catch(()=>{});$("#bgVid2").play().catch(()=>{});}
  }
  if(vid.paused)releaseWakeLock();else requestWakeLock();
};
vid.onended=next;
vid.onerror=()=>{const c=vid.error&&vid.error.code;
  toast(c===4?"iPhoneが再生できない形式です":c===3?"デコード失敗（形式が特殊です）":
        c===2?"データを読み出せません":"再生エラー "+c);};
vid.ontimeupdate=()=>{
  const it=queue[qi];if(!it)return;
  const s=it.start||0,e=it.end||vid.duration||0;
  if(it.end&&vid.currentTime>=it.end-0.03){next();return;}
  const p=e>s?((vid.currentTime-s)/(e-s))*100:0;
  $("#tFill").style.width=Math.max(0,Math.min(100,p))+"%";
  $("#miniTime").textContent=fmt(vid.currentTime-s)+" / "+fmt(e-s);
  if((mpTick=(mpTick+1)%8)===0)mediaPos();
};
$("#tBar").onclick=e=>{
  const it=queue[qi];if(!it)return;const r=$("#tBarIn").getBoundingClientRect();
  const s=it.start||0,en=it.end||vid.duration||0;
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  vid.currentTime=s+(en-s)*p;
};

// ===== REMINDER MODE用の変数はここで先に定義しておく =====
// 理由：起動直後のデフォルトmodeが"reminder"のため、直後のapplyAnMode()が
// 即座にloadReminders()を呼んで_remListに書き込もうとする。_remListの定義が
// もし後方（drawReminderScene関数の近く）にあると、まだ定義されていない変数を
// 先に触ることになりJSがエラーで停止し、それより後ろの処理（openDB()を含む
// 起動処理全体）が丸ごと実行されなくなる（2026-08-19発見・修正）。
const REM_KEY="ojisan_reminders_v1";
const REM_FONT_SYS='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif';
const REM_FONT_MONO='ui-monospace,"SF Mono",Menlo,monospace';
let _remList=[],_remReadAt=0;

const AN_ORDER=["sparks","video","reminder"];
let anMode="reminder";
applyAnMode();
let bgVideoURL=null;
function hasBgVideo(){return !!$("#bgVid").src;}
function nextAnMode(cur){
  let idx=AN_ORDER.indexOf(cur);
  for(let i=0;i<AN_ORDER.length;i++){
    idx=(idx+1)%AN_ORDER.length;
    if(AN_ORDER[idx]==="video"&&!hasBgVideo())continue;
    return AN_ORDER[idx];
  }
  return cur;
}
function applyAnMode(){
  const isVideo=anMode==="video";
  const isSparks=anMode==="sparks";
  $("#dotsBoxNow").classList.toggle("on",!isVideo);
  $("#dotsBoxSide").classList.toggle("on",!isVideo);
  $("#videoBoxNow").classList.toggle("on",isVideo);
  $("#videoBoxSide").classList.toggle("on",isVideo);
  // sparksモードは.sparkGrid（CSSアニメのみ）、reminderモードはcanvas、
  // どちらか一方だけを.onクラスで表示する（2026-08-19、canvas常時描画をやめた変更）
  $("#sparkGridNow").classList.toggle("on",isSparks);
  $("#sparkGridSide").classList.toggle("on",isSparks);
  $("#analyzer").classList.toggle("on",anMode==="reminder");
  $("#analyzer2").classList.toggle("on",anMode==="reminder");
  const nextLabel={sparks:"動画",video:"Reminder",reminder:"ドット"}[anMode];
  const label="⇄ "+nextLabel;
  $("#anSwitch").textContent=label;
  $("#anSwitch2").textContent=label;
  if(isVideo){
    if(!vid.paused){$("#bgVid").play().catch(()=>{});$("#bgVid2").play().catch(()=>{});}
  }else{
    $("#bgVid").pause();$("#bgVid2").pause();
  }
  if(anMode==="reminder")loadReminders();
}
function cycleAnMode(){
  anMode=nextAnMode(anMode);
  applyAnMode();
}
$$("#anCapNow, #anCapSide").forEach(el=>{
  el.onclick=()=>cycleAnMode();
});

async function storeBgVideo(f){
  const old=await one("bgvideo","main");
  if(old&&old.chunks)for(let i=0;i<old.chunks;i++){try{await del("chunks","main:"+i)}catch(_){}}
  const type=f.type||"video/mp4";
  const n=Math.max(1,Math.ceil(f.size/CHUNK));
  try{
    for(let i=0;i<n;i++){
      const buf=await f.slice(i*CHUNK,Math.min(f.size,(i+1)*CHUNK)).arrayBuffer();
      await put("chunks",{id:"main:"+i,data:buf});
      if(n>4&&i%3===0)toast("背景動画 保存中 "+Math.round((i+1)/n*100)+"%");
    }
    await put("bgvideo",{id:"main",name:f.name,type,size:f.size,chunks:n,addedAt:Date.now()});
    return true;
  }catch(err){
    for(let i=0;i<n;i++){try{await del("chunks","main:"+i)}catch(_){}}
    toast("背景動画の保存に失敗しました");
    return false;
  }
}
async function loadBgVideo(){
  try{
    const rec=await one("bgvideo","main");
    if(!rec)return;
    const b=await blobOf(rec);
    if(!b)return;
    if(bgVideoURL)URL.revokeObjectURL(bgVideoURL);
    bgVideoURL=URL.createObjectURL(b);
    $("#bgVid").src=bgVideoURL;
    $("#bgVid2").src=bgVideoURL;
  }catch(_){}
}

let mpTick=0;
const AN_COLS=23,AN_ROWS=25;
const AN_TOTAL=AN_COLS*AN_ROWS;

// ===== ドット演出（sparkGrid、2026-08-19に書き直し） =====
// 旧実装は毎フレームrequestAnimationFrameでgetComputedStyle/getBoundingClientRectを
// canvas2枚ぶん(#analyzer/#analyzer2)×毎フレーム呼んで575マスを再計算・再描画しており、
// これがVDECK再生中の発熱の主因だった（詳細はCSS側の.sparkGridコメント参照）。
// 新実装はページ読み込み時に一度だけ575個のdivを生成するだけで、以後JSは一切動かず
// 明滅そのものはCSS keyframes（vdSparkFlicker）に完全に任せる。
function buildSparkGrid(el){
  if(!el||el.dataset.built)return;
  el.dataset.built="1";
  const frag=document.createDocumentFragment();
  for(let i=0;i<AN_TOTAL;i++){
    const c=document.createElement("div");
    c.className="cell";
    const delay=(Math.random()*3).toFixed(2);
    const dur=(2.4+Math.random()*1.6).toFixed(2);
    c.style.animationDelay="-"+delay+"s";
    c.style.animationDuration=dur+"s";
    frag.appendChild(c);
  }
  el.appendChild(frag);
}
buildSparkGrid($("#sparkGridNow"));
buildSparkGrid($("#sparkGridSide"));

// ===== REMINDER MODE（おじさんリマインダーアプリと同一originのlocalStorageを直読み） =====
// REM_KEY/_remList等の定義は前方（AN_ORDERの直前）に移動済み。ここでは関数だけ定義する。
function remDaysUntil(s){
  if(!s)return null;
  const d=new Date(s);if(isNaN(d))return null;d.setHours(0,0,0,0);
  const t=new Date();t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function loadReminders(){
  let list=[];
  try{list=JSON.parse(localStorage.getItem(REM_KEY)||"[]");}catch(_){}
  list=(Array.isArray(list)?list:[]).filter(r=>r&&r.title&&!r.completed);
  list.forEach(r=>{r._days=remDaysUntil(r.deadline);});
  list.sort((a,b)=>{
    const av=a._days==null?Infinity:a._days, bv=b._days==null?Infinity:b._days;
    return av-bv;
  });
  _remList=list;_remReadAt=Date.now();
  if(anMode==="reminder")renderReminderCanvases();
}
loadReminders();
setInterval(loadReminders,30000);

function drawReminderScene(g,wCss,hCss){
  const cs=getComputedStyle(document.body);
  const ink=cs.getPropertyValue("--ink").trim()||"#141312";
  const fg=cs.getPropertyValue("--fg").trim()||"#efe9e0";
  const dim=cs.getPropertyValue("--dim").trim()||"#948c82";
  const amber=cs.getPropertyValue("--amber").trim()||"#e8a33d";
  const cut=cs.getPropertyValue("--cut").trim()||"#d9584a";
  const line=cs.getPropertyValue("--line").trim()||"#3a3633";

  g.fillStyle=ink;g.fillRect(0,0,wCss,hCss);

  const unit=Math.max(2,wCss/60);
  const padX=unit*4;
  let y=unit*7;

  g.textBaseline="alphabetic";
  g.font="700 "+Math.round(unit*3.2)+"px "+REM_FONT_MONO;
  g.fillStyle=amber;
  g.fillText("Reminder",padX,y);
  y+=unit*2;
  g.strokeStyle=line;g.lineWidth=Math.max(1,unit*0.25);
  g.beginPath();g.moveTo(padX,y);g.lineTo(wCss-padX,y);g.stroke();
  y+=unit*4.5;

  if(_remList.length===0){
    g.font=Math.round(unit*2.8)+"px "+REM_FONT_SYS;
    g.fillStyle=dim;
    g.fillText("リマインドはありません",padX,y+unit*2);
    return;
  }

  const rowH=unit*6.2;
  const maxRows=Math.max(1,Math.floor((hCss-y-unit*3)/rowH));
  const items=_remList.slice(0,maxRows);

  items.forEach(r=>{
    const d=r._days,adv=r.advance_days||3;
    let color=fg,label="―";
    if(d==null){color=dim;label="―";}
    else if(d<0){color=cut;label=Math.abs(d)+"日超過";}
    else if(d===0){color=cut;label="本日";}
    else if(d<=Math.min(adv,2)){color=cut;label=d+"日後";}
    else if(d<=7){color=amber;label=d+"日後";}
    else{color=fg;label=d+"日後";}

    g.font="600 "+Math.round(unit*2.9)+"px "+REM_FONT_SYS;
    g.fillStyle=fg;
    const maxTitleW=wCss-padX*2-unit*13;
    let title=r.title;
    while(g.measureText(title).width>maxTitleW&&title.length>1){title=title.slice(0,-1);}
    if(title!==r.title)title+="…";
    g.fillText(title,padX,y+rowH*0.62);

    g.font="700 "+Math.round(unit*2.6)+"px "+REM_FONT_MONO;
    g.fillStyle=color;
    const lw=g.measureText(label).width;
    g.fillText(label,wCss-padX-lw,y+rowH*0.62);

    y+=rowH;
  });

  if(_remList.length>items.length){
    g.font=Math.round(unit*2.2)+"px "+REM_FONT_MONO;
    g.fillStyle=dim;
    g.fillText("+"+(_remList.length-items.length)+"件",padX,y+unit*1.5);
  }
}
// canvasはreminderモードの時だけ、リマインダーのテキストシーンを描く。
// 旧実装と違って「毎フレーム」ではなく「モード切替時・データ更新(30秒毎)時・
// リサイズ時」だけ呼ぶので、getComputedStyle等の重い処理も低頻度になり
// 実質問題にならない（毎秒60回超→多くて数十秒に1回程度）。
function renderReminderCanvas(cv){
  if(!cv)return;
  const rect=cv.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const wCss=Math.max(1,Math.round(rect.width));
  const hCss=Math.max(1,Math.round(rect.height));
  if(wCss<=1||hCss<=1)return;
  if(cv.width!==Math.round(wCss*dpr)||cv.height!==Math.round(hCss*dpr)){
    cv.width=Math.round(wCss*dpr);cv.height=Math.round(hCss*dpr);
  }
  const g=cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,wCss,hCss);
  drawReminderScene(g,wCss,hCss);
}
function renderReminderCanvases(){
  renderReminderCanvas($("#analyzer"));
  renderReminderCanvas($("#analyzer2"));
}
// 横向き⇄縦向きの切り替えやウィンドウリサイズでcanvasの実サイズが変わった時だけ、
// reminderモードなら再描画する（ポーリングではなくResizeObserverでイベント駆動）。
if("ResizeObserver" in window){
  const _remRO=new ResizeObserver(()=>{ if(anMode==="reminder")renderReminderCanvases(); });
  _remRO.observe($("#analyzer"));
  _remRO.observe($("#analyzer2"));
}

function togglePlay(){
  if(!queue.length)return toast("曲を選んでください");
  vid.paused?vid.play().catch(()=>{}):vid.pause();
}
function bindTapAndSwipe(el){
  let sx=0,sy=0,tracking=false;
  el.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;tracking=true;});
  el.addEventListener("pointerup",e=>{
    if(!tracking)return;tracking=false;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5)cycleAnMode();
    else if(Math.abs(dx)<10&&Math.abs(dy)<10)togglePlay();
  });
  el.addEventListener("pointercancel",()=>{tracking=false;});
}
// タップ/スワイプは#analyzer(canvas)単体ではなく親の.analyzerWrap全体で拾う。
// sparksモード中はcanvasがdisplay:noneになる（.sparkGridが代わりに表示される）ため、
// canvas単体にバインドしたままだとsparksモード中はジェスチャーが効かなくなる。
bindTapAndSwipe($("#dotsBoxNow"));
bindTapAndSwipe($("#dotsBoxSide"));

async function reload(){
  [VIDEOS,PLAYLISTS]=await Promise.all([all("videos"),all("playlists")]);
  renderLib();renderPl();
  if(navigator.storage&&navigator.storage.estimate){
    const e=await navigator.storage.estimate();
    $("#quota").textContent=mb(e.usage||0)+" 使用中";
  }
}
openDB().then(reload).then(syncBtns).then(mediaSetup).then(loadBgVideo).catch(e=>{
  document.body.innerHTML='<p style="padding:40px;color:#e8a33d;font-family:sans-serif">保存領域が使えませんでした。Safariのプライベートブラウズを解除してから開き直してください。<br><br>'+e+'</p>';
});
