<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>おじさんリマインダー - ウィジェット</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1A1614;
    --bg-2:        #141210;
    --surface:     #262220;
    --surface-2:   #302C2A;
    --border:      #3A3532;
    --text:        #F0EBE6;
    --text-sub:    #9E9691;
    --text-faint:  #615D5A;
    --accent:      #C85C3A;
    --accent-dim:  #3A1E12;
    --success:     #2A7A4E;
    --success-dim: #132B1E;
    --warning:     #B87828;
    --warning-dim: #2A1E08;
    --danger:      #B83838;
    --danger-dim:  #2A1010;
    --purple:      #7255A8;
    --purple-dim:  #1E1530;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ===== HEADER（ドラッグで常駐ウィンドウを移動できるよう -webkit-app-region は使わず素のバーのみ） ===== */
  .w-header {
    flex: none;
    height: 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 10px;
    gap: 8px;
  }
  .w-title { font-size: 12px; font-weight: 700; color: var(--text-sub); letter-spacing: .3px; white-space: nowrap; }
  .w-count {
    font-size: 11px; font-weight: 700; color: var(--danger);
    background: var(--danger-dim); border-radius: 999px;
    padding: 1px 7px; display: none;
  }
  .w-count.show { display: inline-block; }
  .w-addbtn {
    margin-left: auto;
    width: 26px; height: 26px; border-radius: 7px;
    border: none; background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .w-addbtn:active { opacity: .8; }

  /* ===== VIEWS ===== */
  .w-view { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .w-view.active { display: flex; }

  /* ---- LIST ---- */
  #w-list { overflow-y: auto; padding: 8px; gap: 6px; display: flex; flex-direction: column; }
  .w-empty {
    text-align: center; color: var(--text-faint); font-size: 12px;
    padding: 24px 8px;
  }
  .w-row {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .w-row.overdue { border-left-color: var(--purple); }
  .w-row.urgent  { border-left-color: var(--danger); }
  .w-row.soon    { border-left-color: var(--warning); }
  .w-row-main { flex: 1; min-width: 0; }
  .w-row-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .w-row-date { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .w-row-del {
    flex: none; width: 24px; height: 24px; border-radius: 6px;
    border: none; background: transparent; color: var(--text-faint);
    font-size: 14px; cursor: pointer;
  }
  .w-row-del:active { background: var(--danger-dim); color: var(--danger); }

  /* ---- ADD FORM ---- */
  #w-add { padding: 12px; gap: 10px; overflow-y: auto; }
  .w-field { display: flex; flex-direction: column; gap: 4px; }
  .w-field label { font-size: 11px; color: var(--text-sub); font-weight: 600; }
  .w-field input, .w-field textarea {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px;
    padding: 8px 9px; font-family: inherit;
  }
  .w-field textarea { resize: none; min-height: 50px; }
  .w-err { font-size: 11px; color: var(--danger); display: none; }
  .w-err.show { display: block; }
  .w-btnrow { display: flex; gap: 8px; margin-top: 4px; }
  .w-btn {
    flex: 1; padding: 9px; border-radius: 7px; border: none;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .w-btn-primary { background: var(--accent); color: #fff; }
  .w-btn-ghost   { background: var(--surface-2); color: var(--text-sub); }
  .w-btn:active  { opacity: .8; }

  /* ---- DETAIL ---- */
  #w-detail { padding: 0; }
  .w-back {
    flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-sub); font-size: 12px; font-weight: 700;
    cursor: pointer;
  }
  .w-back:active { opacity: .8; }
  .w-detail-body { padding: 14px; overflow-y: auto; }
  .w-detail-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .w-detail-chip {
    display: inline-block; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; margin-bottom: 12px;
  }
  .w-detail-chip.overdue { background: var(--purple-dim); color: var(--purple); }
  .w-detail-chip.urgent  { background: var(--danger-dim); color: var(--danger); }
  .w-detail-chip.soon    { background: var(--warning-dim); color: var(--warning); }
  .w-detail-chip.later   { background: var(--surface-2); color: var(--text-sub); }
  .w-detail-notes {
    font-size: 12px; color: var(--text-sub); line-height: 1.6;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; white-space: pre-wrap;
    margin-bottom: 14px; min-height: 20px;
  }
  .w-detail-notes:empty::before { content: 'メモはありません'; color: var(--text-faint); }
</style>
</head>
<body>
<div id="app">

  <div class="w-header">
    <div class="w-title">リマインダー</div>
    <div class="w-count" id="wCount">0件</div>
    <button class="w-addbtn" id="wAddBtn" aria-label="追加" onclick="wOpenAdd()">＋</button>
  </div>

  <!-- ===== LIST VIEW ===== -->
  <div class="w-view active" id="w-list-view">
    <div id="w-list"></div>
  </div>

  <!-- ===== ADD VIEW ===== -->
  <div class="w-view" id="w-add-view">
    <div class="w-back" onclick="wCloseAdd()">← リストへ戻る</div>
    <div id="w-add">
      <div class="w-field">
        <label for="wTitle">項目</label>
        <input type="text" id="wTitle" placeholder="例：見積書を送る" maxlength="80">
      </div>
      <div class="w-field">
        <label for="wDate">期限日</label>
        <input type="date" id="wDate">
      </div>
      <div class="w-field">
        <label for="wNotes">メモ（任意）</label>
        <textarea id="wNotes" placeholder="補足があれば"></textarea>
      </div>
      <div class="w-err" id="wErr">項目名を入れてほしいです</div>
      <div class="w-btnrow">
        <button class="w-btn w-btn-ghost" onclick="wCloseAdd()">キャンセル</button>
        <button class="w-btn w-btn-primary" onclick="wSaveAdd()">追加する</button>
      </div>
    </div>
  </div>

  <!-- ===== DETAIL VIEW ===== -->
  <div class="w-view" id="w-detail-view">
    <div class="w-back" onclick="wCloseDetail()">← リストへ戻る</div>
    <div class="w-detail-body" id="w-detail-body"></div>
  </div>

</div>

<script src="core.js"></script>
<script src="widget.js"></script>
</body>
</html>
